<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水母吉祥物 · 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    color: #3A2A22;
    background:
      radial-gradient(120% 120% at 12% 8%, #FFD29B, transparent 46%),
      radial-gradient(120% 120% at 88% 92%, #FF9E9A, transparent 50%),
      linear-gradient(160deg, #FFF1E2 0%, #FFE2D6 48%, #FFD0D4 100%);
    min-height: 100vh; overflow: hidden;
  }
  .hint {
    position: fixed; top: 26px; left: 0; right: 0; text-align: center;
    color: #B06A3A; font-size: 14px; z-index: 1; letter-spacing: 0.5px;
  }
  #jelly-companion {
    position: fixed; top: 0; left: 0; width: 220px; height: 340px;
    pointer-events: none; will-change: transform; z-index: 2;
  }
</style>
</head>
<body>
  <p class="hint">移动鼠标 —— 水母会保持距离跟随你，并一直盯着你看 ✦</p>
  <div id="jelly-companion" aria-hidden="true"></div>

  <script src="jellyfish.js"></script>
  <script>
    if (window.Jellyfish) window.Jellyfish.init('#jelly-companion', { leash: 140 });
  </script>
</body>
</html>
